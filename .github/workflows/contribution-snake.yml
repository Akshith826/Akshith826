name: Generate Contribution Snake

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Akshith826
          outputs: |
            dist/github-contribution-snake.svg?palette=github-dark

      - name: Commit generated SVG
        uses: EndBug/add-and-commit@v9
        with:
          add: "dist/github-contribution-snake.svg"
          default_author: github_actions
          message: "chore: update contribution snake"
