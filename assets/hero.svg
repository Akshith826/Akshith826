<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b1024"/>
    <stop offset="50%" stop-color="#23245a"/>
    <stop offset="100%" stop-color="#155e75"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" x2="1">
    <stop offset="0%" stop-color="#67e8f9"/>
    <stop offset="50%" stop-color="#818cf8"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#a5b4fc" stroke-opacity=".10"/>
  </pattern>
</defs>

<rect x="0" y="0" width="1400" height="430" rx="28" fill="url(#bg)"/>
<rect x="0" y="0" width="1400" height="430" rx="28" fill="url(#grid)"/>

<circle cx="1130" cy="100" r="130" fill="#67e8f9" opacity=".15" filter="url(#blur)">
  <animate attributeName="r" values="110;145;110" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="270" cy="360" r="160" fill="#818cf8" opacity=".13" filter="url(#blur)">
  <animate attributeName="r" values="145;175;145" dur="6s" repeatCount="indefinite"/>
</circle>

<g fill="none" stroke="url(#glow)" stroke-width="2" opacity=".55">
  <path d="M55 355 C300 245, 470 430, 720 305 S1120 165, 1350 265">
    <animate attributeName="stroke-dasharray" values="1 18;14 10;1 18" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M110 92 C330 185, 525 15, 770 105 S1115 220, 1320 95" opacity=".5"/>
</g>

<g fill="#dbeafe">
  <circle cx="110" cy="88" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="1270" cy="75" r="3"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1215" cy="335" r="2"><animate attributeName="opacity" values=".3;1;.3" dur="2.1s" repeatCount="indefinite"/></circle>
</g>

<text x="700" y="175" text-anchor="middle" fill="#f8fafc"
      font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800"
      letter-spacing="1.5">
  AKSHITH AMBATIPUDI
</text>
<text x="700" y="235" text-anchor="middle" fill="#dbeafe"
      font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">
  AI Full Stack Engineer
</text>
<text x="700" y="285" text-anchor="middle" fill="#a5b4fc"
      font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">
  MERN Stack  ·  ServiceNow  ·  AI Agents  ·  Product Engineering
</text>

<g transform="translate(470,330)">
  <rect width="460" height="40" rx="20" fill="#0f172a" fill-opacity=".75" stroke="#93c5fd" stroke-opacity=".45"/>
  <text x="230" y="26" text-anchor="middle" fill="#e0f2fe"
        font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
    BUILD  →  INTEGRATE  →  SHIP  →  ITERATE
  </text>
</g>
</svg>